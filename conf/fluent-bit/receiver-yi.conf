# Fluent Bit RECEIVER — runs on yi (10.13.0.2), the blue box.
# Listens on the wg interface, lands each source as NDJSON for the AI layer to tail.
# Install to: /etc/fluent-bit/fluent-bit.conf
# No parsers needed here: records arrive already structured over the forward protocol.

[SERVICE]
    flush       1
    daemon      off
    log_level   info

# Bind to the wg address ONLY so this port is never exposed on the AX10 LAN.
[INPUT]
    name        forward
    listen      10.13.0.2
    port        24224

# `format plain` writes one raw JSON record per line => clean NDJSON.
# Verify after start:  tail -1 /data/suricata/eve.ndjson | jq .
[OUTPUT]
    name        file
    match       suricata
    path        /data/suricata
    file        eve.ndjson
    format      plain

# All Zeek logs land in one stream; each line carries `log_path` (e.g. .../http.log)
# so you can split by protocol downstream.
[OUTPUT]
    name        file
    match       zeek
    path        /data/zeek
    file        zeek.ndjson
    format      plain
