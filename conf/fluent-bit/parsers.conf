# Minimal parser set for the telemetry agent on san (.1).
# We only need to turn each already-JSON log line into a structured record so the
# receiver can re-emit clean NDJSON. We deliberately do NOT parse the time field:
# the real event time stays in the payload (`timestamp` for Suricata, `ts` for
# Zeek) and Fluent Bit stamps its own ingest time for routing. This avoids
# timezone/format fights and never drops a record over a bad time parse.

[PARSER]
    Name   json
    Format json
