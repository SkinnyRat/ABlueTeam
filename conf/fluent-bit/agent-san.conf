# Fluent Bit AGENT — runs on san (10.13.0.1), the range/gateway box.
# Tails Suricata + Zeek JSON logs and forwards them over wg0 to the blue box (yi).
# Install to: /etc/fluent-bit/fluent-bit.conf  (parsers.conf alongside it)

[SERVICE]
    flush                      1
    daemon                     off
    log_level                  info
    parsers_file               parsers.conf
    # Disk buffering: if yi restarts, events queue on san instead of being lost.
    storage.path               /var/log/flb-buffer/
    storage.sync               normal
    storage.backlog.mem_limit  20M
    storage.max_chunks_up      64

# --- Suricata: eve.json is already NDJSON (http, alert, flow, dns, tls, smb, krb5...)
[INPUT]
    name              tail
    alias             suricata
    path              /var/log/suricata/eve.json
    tag               suricata
    parser            json
    db                /var/log/flb-suricata.db   # remembers read offset across restarts
    storage.type      filesystem
    refresh_interval  5
    rotate_wait       5
    skip_long_lines   on
    buffer_max_size   2M

# --- Zeek: all *.log in current/ become JSON once LogAscii::use_json=T (see local.zeek).
#     path_key keeps the source filename as a field so the AI layer can split by log.
#     Adjust `path` if your Zeek install logs elsewhere (/usr/local/zeek, /var/log/zeek).
[INPUT]
    name              tail
    alias             zeek
    path              /opt/zeek/logs/current/*.log
    exclude_path      *stderr.log,*stdout.log
    tag               zeek
    parser            json
    path_key          log_path
    db                /var/log/flb-zeek.db
    storage.type      filesystem
    refresh_interval  5
    skip_long_lines   on

# --- Forward everything to yi over wg0. Inside WireGuard already => no TLS needed.
#     Native forward protocol (msgpack) carries the tags, so routing survives the hop.
[OUTPUT]
    name              forward
    match             *
    host              10.13.0.2
    port              24224
