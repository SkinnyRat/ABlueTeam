# suricata-update enable.conf
# Step 2 of the allowlist pattern: re-enable ONLY the ET Open groups we want.
# Applied after disable.conf (`re:.`), so these win. `group:<file>` enables all
# rules in that category file.

# --- WEB (DVWA / Juice Shop, and the HTTP-visible part of kube-goat) ---
group:emerging-web_server.rules
group:emerging-web_specific_apps.rules
group:emerging-web_client.rules
group:emerging-sql.rules             # SQLi
group:emerging-attack_response.rules # successful-exploit / data exfil signatures
group:emerging-user_agents.rules     # scanner / tool UAs (nikto, sqlmap, dirb...)
group:emerging-scan.rules            # recon / port & dir scanning

# --- AD / GOAD (SMB, DCERPC, named CVEs) ---
group:emerging-netbios.rules         # SMB/NTLM, EternalBlue, SMBGhost, PetitPotam
group:emerging-rpc.rules             # DCERPC: PsExec/svcctl, Zerologon, PrintNightmare
group:emerging-policy.rules          # policy-violating / suspicious protocol use

# --- Cross-cutting ---
group:emerging-exploit.rules         # misc named exploits (web + AD land here too)

# NOTE on kube: ET Open has essentially NO Kubernetes signatures, so there is nothing
# to enable here and no RAM to weigh. kube-goat's network-visible traffic is HTTP(S)
# to the API server / web apps, already covered by the WEB groups above. Real k8s
# attack detection is host/syscall-level (Falco on the cluster node), not a Suricata
# rule set -- see Telemetry_pipeline.md.
