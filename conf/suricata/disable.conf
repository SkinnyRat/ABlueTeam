# suricata-update disable.conf
# Step 1 of the allowlist pattern: turn EVERYTHING off.
# `re:.` matches every rule msg, so suricata-update disables the whole ET Open set.
# enable.conf (applied AFTER this) then switches back on only the lab-relevant groups.
# Net effect: suricata.rules holds ~a few thousand rules instead of ~45k, which is
# the single biggest Suricata RAM lever (smaller MPM / pattern-matching tables).
re:.
